<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestiTaches - Gestion des tâches</title>
</head>
<body>

    <h1>GestiTaches</h1>
    <p>Application de gestion des tâches personnelles</p>

    <h2>Créer une nouvelle tâche</h2>

    <form id="form-tache">
        <label for="titre">Titre de la tâche :</label>
        <input type="text" id="titre" name="titre" required>

        <br><br>

        <label for="description">Description :</label>
        <textarea id="description" name="description"></textarea>

        <br><br>

        <label for="date">Date d'échéance :</label>
        <input type="date" id="date" name="date">

        <br><br>

        <button type="submit">Ajouter la tâche</button>
    </form>

   <h2>Liste des tâches</h2>

<ul id="liste-taches"></ul>

<p id="message-vide">Aucune tâche enregistrée pour le moment.</p>

</body>
</html>

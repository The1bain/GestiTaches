
name: CI - Tests et couverture

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests Maven et JaCoCo
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Executer les tests et verifier la couverture
        run: mvn -B verify

      - name: Publier le rapport JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-jacoco
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Publier le SBOM CycloneDX
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            target/bom.json
            target/bom.xml
          if-no-files-found: error
